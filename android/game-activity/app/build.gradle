plugins {
    id 'com.android.application'
}

android {
    compileSdk = 35

    defaultConfig {
        applicationId = "com.github.rust_mobile.bevyshapesgame"
        minSdk = 31
        targetSdk = 35
        versionCode = 1
        versionName = "1.0"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = null  // unsigned release APK
        }
        debug {
            minifyEnabled = false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace = 'com.github.rust_mobile.bevyshapesgame'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'

    // GameActivity library (android-activity game-activity backend)
    implementation "androidx.games:games-activity:4.4.0"
}
